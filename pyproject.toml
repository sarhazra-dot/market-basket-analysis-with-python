[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-basket-analysis"
version = "1.0.0"
description = "End-to-end market basket analysis: clean transactions, mine frequent itemsets, generate association rules, visualize and recommend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "mlxtend>=0.23",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "openpyxl>=3.1"]
excel = ["openpyxl>=3.1"]

[project.scripts]
marketbasket = "marketbasket.cli:main"

[tool.setuptools.packages.find]
include = ["marketbasket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
