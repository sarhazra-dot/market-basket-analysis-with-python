name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke test the CLI
        run: |
          marketbasket generate-data --out /tmp/sample.csv --n-transactions 500
          marketbasket run --input /tmp/sample.csv --output-dir /tmp/out --min-support 0.02
          marketbasket recommend --rules /tmp/out/rules.csv --item "Spaghetti"
